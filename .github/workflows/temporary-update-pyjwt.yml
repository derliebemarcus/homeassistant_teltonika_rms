name: Temporary PyJWT lock update

on:
  push:
    branches:
      - bugfix/116-fix-ci-runtime-gates

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bugfix/116-fix-ci-runtime-gates
          fetch-depth: 0

      - name: Update PyJWT pin
        shell: python
        run: |
          from pathlib import Path

          source = Path("requirements-dev.in")
          source_text = source.read_text(encoding="utf-8")
          pin = "pyjwt[crypto]==2.13.0"
          if pin not in source_text:
              source.write_text(source_text.rstrip() + f"\n{pin}\n", encoding="utf-8")

          lock = Path("requirements.txt")
          lock_text = lock.read_text(encoding="utf-8")
          old = "pyjwt[crypto]==2.12.1"
          if old not in lock_text:
              raise SystemExit(f"Expected lock entry not found: {old}")
          lock.write_text(lock_text.replace(old, pin, 1), encoding="utf-8")

      - name: Commit update
        run: |
          git rm .github/workflows/temporary-update-pyjwt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add requirements-dev.in requirements.txt
          git commit -m "fix: upgrade PyJWT security release"
          git push origin HEAD:bugfix/116-fix-ci-runtime-gates
